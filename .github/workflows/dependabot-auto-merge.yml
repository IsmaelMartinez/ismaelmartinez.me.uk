name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge on non-major dev and transitive-patch updates
        # Direct production dependencies always get a human review: a
        # compromised patch release must not ship itself. Grouped PRs that mix
        # production and dev dependencies fall through to manual review too.
        # Patch bumps of transitive (indirect) dependencies are lockfile-only
        # and are usually the fix for an open alert; before they qualified,
        # vite's patch (#473) sat for days with every check green. The main
        # branch requires the validate check, so --auto waits for CI.
        if: >-
          (steps.metadata.outputs.update-type != 'version-update:semver-major' &&
           steps.metadata.outputs.dependency-type == 'direct:development') ||
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
           steps.metadata.outputs.dependency-type == 'indirect')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
