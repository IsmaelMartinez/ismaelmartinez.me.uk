name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Six-hourly rebuild: the health dashboard's data is fetched at build
    # time, so a scheduled run keeps it fresh. Deploy is not triggered here;
    # gh-pages.yml listens for this workflow's success, so a red scheduled
    # run refreshes nothing and blocks the deploy instead of shipping it.
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  # Everything that is not the test suite. It costs well under a minute all
  # together, so it stays whole rather than being split further.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Build the site
        run: npm run build

      - name: Check links
        run: npm run check-links

  # The test suite, sharded across runners. A hosted runner gives Vitest three
  # worker processes and the CALCIO '90 sweeps are several times that much
  # work, so on one runner the suite is a quarter of an hour whatever order the
  # files run in: it is compute-bound rather than waiting on anything. Vitest
  # shards by file, so this is only worth having alongside the split of those
  # sweeps into a file each.
  test:
    runs-on: ubuntu-latest
    strategy:
      # A red shard should not cancel the others: which shard went red is a
      # third of the diagnosis.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tests/build/output.test.ts reads ./dist and skips itself without one,
      # so a shard that did not build would silently drop those assertions.
      - name: Build the site
        run: npm run build

      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
        run: npx vitest run --shard="$SHARD/3"

  # The single required status check, kept under that name so the branch
  # protection rule still points at something. It exists only to go red when a
  # job above did: `needs` on its own would leave it *skipped* after a failure,
  # and a skipped required check does not block a merge.
  validate:
    needs: [checks, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check or shard did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
